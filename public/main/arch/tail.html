<h1>Tail</h1>

<p style="margin-bottom: 6px"></p>
<pre style="margin-top: 6px"><code class="language-bash"># Вывести 50 последних записей из лога:
tail -n 50 
</code></pre>

<p style="margin-bottom: 6px">Очистить файл лога, не удаляя сам файл:</p>
<pre style="margin-top: 6px"><code class="language-bash"># Полезно, если нужно удалить старые логи перед запуском конкретной команды:
truncate -s 0 /path/to/logfile.log
</code></pre>
